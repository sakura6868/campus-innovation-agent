name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # 测试使用临时 SQLite，不依赖任何外部服务（Postgres / LLM / Chroma）。
    env:
      DATABASE_URL: sqlite:////tmp/campus_agent_ci.db
      RAG_USE_ST: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -q
