# Render Blueprint —— 连接 GitHub 仓库后一键创建 Web 服务 + 免费 Postgres
# 使用：Render 控制台 → New → Blueprint → 选本仓库 → 自动按此文件部署
services:
  - type: web
    name: campus-innovation-agent
    runtime: docker
    plan: free                 # 免费套餐；15 分钟无访问会休眠，首次访问冷启动稍慢
    branch: master
    healthCheckPath: /health   # 对应 api.py 的 /health 端点
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-db
          property: connectionString   # 自动注入免费 Postgres 的连接串
      - key: ADMIN_API_TOKEN
        generateValue: true            # 所有数据维护接口强制使用 X-Admin-Token
      - key: AUTH_TOKEN_SECRET
        generateValue: true            # 签发用户会话，与管理员令牌分离
      - key: AUTH_TOKEN_TTL_SECONDS
        value: "28800"
      - key: WEB_SEARCH_PROVIDER
        value: "duckduckgo"            # 免 key 联网搜索补充层；Render 直连公网可用。如需更稳结果改 tavily 并设 WEB_SEARCH_API_KEY
      # RAG_USE_ST 不显式设置即「自动」：本地已预热 all-MiniLM-L6-v2 时默认开启真·语义检索；
      # Render 免费实例未打包模型时自动降级轻量关键词检索，保证启动零联网依赖。
      # 如需在 Render 启用语义检索，请在 Dockerfile 中把模型打包进镜像后设 RAG_USE_ST=1。
      # - key: RAG_USE_ST
      #   value: "1"
      # 通义千问（DashScope OpenAI 兼容端点）润色层。
      # 重要：Render 蓝图对名称含 API_KEY/SECRET/TOKEN 的变量会忽略 `value:` 且
      # 将其标记为「蓝图托管」，导致在 dashboard 手动填的值被下次同步覆盖为空。
      # 因此这里用 sync:false —— 密钥只由 Render 控制台 Environment 管理，蓝图不再触碰，
      # 保证你在 dashboard 填的 key 能稳定生效。请在控制台 Environment 手动添加
      # AGENT_LLM_API_KEY（值见本地 .env）。其余非密钥变量仍由蓝图 value: 注入。
      - key: AGENT_LLM_API_KEY
        sync: false
      - key: AGENT_LLM_BASE_URL
        value: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      - key: AGENT_LLM_MODEL
        value: "qwen-plus"
      - key: AGENT_LLM_TEMPERATURE
        value: "0.3"
      - key: AGENT_LLM_PROVIDER
        value: "qwen"

# 数据库必须放在顶层 databases: 下（不能塞进 services: 里用 type: postgres）
databases:
  - name: campus-db            # 此 name 须与上面 fromDatabase.name 一致
    plan: free                 # 免费 Postgres；数据持久化，重启不丢
    databaseName: campus
    user: campus
    # 首次启动 api 的 lifespan 会自动 init_db() 建表 + seed（16 赛事 + 7 用户）
