# Render Blueprint —— 连接 GitHub 仓库后一键创建 Web 服务 + 免费 Postgres
# 使用：Render 控制台 → New → Blueprint → 选本仓库 → 自动按此文件部署
services:
  - type: web
    name: campus-innovation-agent
    runtime: docker
    plan: free                 # 免费套餐；15 分钟无访问会休眠，首次访问冷启动稍慢
    branch: master
    healthCheckPath: /health   # 对应 api.py 的 /health 端点
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-db
          property: connectionString   # 自动注入免费 Postgres 的连接串
      - key: ADMIN_API_TOKEN
        generateValue: true            # 所有数据维护接口强制使用 X-Admin-Token
      # RAG_USE_ST 不显式设置即「自动」：本地已预热 all-MiniLM-L6-v2 时默认开启真·语义检索；
      # Render 免费实例未打包模型时自动降级轻量关键词检索，保证启动零联网依赖。
      # 如需在 Render 启用语义检索，请在 Dockerfile 中把模型打包进镜像后设 RAG_USE_ST=1。
      # - key: RAG_USE_ST
      #   value: "1"
      # 可选：接真实 LLM 润色时取消下面两行注释并填入（OpenAI 兼容接口）
      # - key: AGENT_LLM_API_KEY
      #   sync: false           # 在 Render 控制台手动填，不入仓库
      # - key: AGENT_LLM_BASE_URL
      #   value: "https://api.openai.com/v1"

# 数据库必须放在顶层 databases: 下（不能塞进 services: 里用 type: postgres）
databases:
  - name: campus-db            # 此 name 须与上面 fromDatabase.name 一致
    plan: free                 # 免费 Postgres；数据持久化，重启不丢
    databaseName: campus
    user: campus
    # 首次启动 api 的 lifespan 会自动 init_db() 建表 + seed（16 赛事 + 7 用户）
